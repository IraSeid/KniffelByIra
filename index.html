<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>KniffelByIra</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--blue:#2563eb;--header:#111827}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:100;background:var(--header);color:#fff;padding:12px 14px;box-shadow:0 2px 8px #0003}
.header-inner,main{max-width:1200px;margin:auto}
.title{font-weight:800;font-size:1.2rem}.subtitle{font-size:.75rem;opacity:.7}
main{padding:10px 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;font-size:.9rem;background:var(--blue);color:#fff}
button.secondary{background:#374151}button.danger{background:#b91c1c}
.hint{font-size:.76rem;color:var(--muted);margin:0 0 8px}
.table-wrapper{overflow:auto;-webkit-overflow-scrolling:touch;height:calc(100vh - 185px);height:calc(100dvh - 185px);min-height:300px;border:1px solid var(--border);border-radius:12px;background:#fff;overscroll-behavior:contain}
.players{display:grid;grid-template-columns:150px repeat(var(--player-count),130px);width:max-content;min-width:calc(150px + var(--player-count)*130px)}
.cell{min-height:50px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center}
.sticky-top{position:sticky;top:0;z-index:20;background:var(--header);color:#fff;box-shadow:0 2px 5px #0003}
.sticky-left{position:sticky;left:0;z-index:10;background:#fff;box-shadow:2px 0 5px #0002}
.corner{z-index:40!important;background:var(--header);color:#fff}
.header-cell{min-height:58px;justify-content:center}
.category{font-weight:700;line-height:1.15}.category-icon{display:inline-block;width:28px;text-align:center;margin-right:3px;font-size:1.1rem}
.section{background:#e5e7eb;font-weight:800;min-height:40px}.sticky-left.section{background:#e5e7eb}
.summary{font-weight:700;background:#f9fafb}.sticky-left.summary{background:#f9fafb}
.bonus{font-weight:800;background:#ecfdf5}.sticky-left.bonus{background:#ecfdf5}
.bonus.missing{background:#fff7ed}.sticky-left.bonus.missing{background:#fff7ed}
.total{font-weight:900;background:#dbeafe}.sticky-left.total{background:#dbeafe}
input{width:100%;min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:1rem;background:#fff;color:var(--text);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 2px #2563eb26}
input[type=number]{text-align:center;font-weight:700;appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.name-remove{display:flex;gap:5px;width:100%;align-items:center}.name-remove input{flex:1}
.remove-player{width:32px;height:32px;padding:0;background:#ef4444}
.fixed-score{width:100%;min-height:36px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
.fixed-score.empty{color:var(--muted);font-weight:500}.fixed-score.failed{color:#b91c1c;background:#fef2f2}
.footer-note{text-align:center;color:var(--muted);font-size:.72rem;margin-top:7px}
@media(orientation:landscape) and (max-height:600px){.table-wrapper{height:calc(100vh - 125px);height:calc(100dvh - 125px)}header{padding:7px 12px}.subtitle{display:none}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="title">🎲 KniffelByIra</div><div class="subtitle">Punktetabelle</div></div></header>
<main>
<div class="toolbar">
<button id="addPlayerBtn">＋ Spieler</button>
<button id="resetBtn" class="danger">↻ Spiel zurücksetzen</button>
<button id="landscapeBtn" class="secondary">🔄 Querformat</button>
</div>
<p class="hint">Spieler-Namen bleiben oben sichtbar. Die Kategorie-Spalte bleibt links sichtbar. Horizontal zwischen Spielern und vertikal durch Kategorien scrollen.</p>
<div class="table-wrapper" id="tableWrapper"><div class="players" id="playersGrid"></div></div>
<div class="footer-note">Spielstände werden automatisch auf diesem Gerät gespeichert.</div>
</main>
<script>
const STORAGE_KEY="kniffelbyira-v2";
const upper=[
{key:"ones",label:"Einser",icon:"⚀",max:6},{key:"twos",label:"Zweier",icon:"⚁",max:12},
{key:"threes",label:"Dreier",icon:"⚂",max:18},{key:"fours",label:"Vierer",icon:"⚃",max:24},
{key:"fives",label:"Fünfer",icon:"⚄",max:30},{key:"sixes",label:"Sechser",icon:"⚅",max:36}];
const lower=[
{key:"threeKind",label:"Dreierpasch",icon:"🎲🎲🎲",type:"number"},
{key:"fourKind",label:"Viererpasch",icon:"🎲🎲🎲🎲",type:"number"},
{key:"fullHouse",label:"Full House",icon:"🏠",fixed:25},
{key:"smallStraight",label:"Kleine Straße",icon:"➖➖➖➖",fixed:30},
{key:"largeStraight",label:"Große Straße",icon:"🔢",fixed:40},
{key:"kniffel",label:"Kniffel",icon:"🎲✨",fixed:50},
{key:"chance",label:"Chance",icon:"🍀",type:"number"}];
const keys=[...upper,...lower].map(x=>x.key);
function player(name){let scores={};keys.forEach(k=>scores[k]="");return{name,scores}}
function defaultState(){return{players:[player("Spieler 1"),player("Spieler 2")]}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&Array.isArray(s.players)&&s.players.length){s.players.forEach(p=>{p.scores=p.scores||{};keys.forEach(k=>{if(p.scores[k]===undefined)p.scores[k]=""})});return s}}catch(e){}return defaultState()}
let state=load();
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function upperTotal(p){return upper.reduce((n,c)=>n+(Number.isFinite(Number(p.scores[c.key]))?Number(p.scores[c.key]):0),0)}
function lowerTotal(p){return lower.reduce((n,c)=>{let v=p.scores[c.key];return n+(v===""||v==="X"?0:(Number.isFinite(Number(v))?Number(v):0))},0)}
function bonus(p){return upperTotal(p)>=63?35:0}
function total(p){return upperTotal(p)+bonus(p)+lowerTotal(p)}
function cell(cls=""){let d=document.createElement("div");d.className="cell "+cls;return d}
function category(grid,c){let d=cell("category sticky-left");d.innerHTML='<span class="category-icon">'+c.icon+'</span><span>'+c.label+'</span>';grid.appendChild(d)}
function upperInput(grid,pi,c){let d=cell(),i=document.createElement("input");i.type="number";i.inputMode="numeric";i.min=0;i.max=c.max;i.step=1;i.value=state.players[pi].scores[c.key];i.oninput=()=>{let v=i.value;if(v==="")state.players[pi].scores[c.key]="";else{v=Math.max(0,Math.min(c.max,Math.floor(Number(v)||0)));state.players[pi].scores[c.key]=String(v);i.value=v}update()};d.appendChild(i);grid.appendChild(d)}
function numberInput(grid,pi,c){let d=cell(),i=document.createElement("input");i.type="number";i.inputMode="numeric";i.min=0;i.step=1;i.value=state.players[pi].scores[c.key];i.oninput=()=>{let v=i.value;state.players[pi].scores[c.key]=v===""?"":String(Math.max(0,Math.floor(Number(v)||0)));update()};d.appendChild(i);grid.appendChild(d)}
function fixed(grid,pi,c){let d=cell(),b=document.createElement("div");b.className="fixed-score";let v=state.players[pi].scores[c.key];if(v===""||v===undefined){b.textContent="–";b.classList.add("empty")}else if(v==="X"){b.textContent="✕";b.classList.add("failed")}else b.textContent=c.fixed;b.onclick=()=>{let x=state.players[pi].scores[c.key];state.players[pi].scores[c.key]=x===""?String(c.fixed):(x===String(c.fixed)?"X":"");render(true)};d.appendChild(b);grid.appendChild(d)}
function section(grid,text){let d=cell("section sticky-left");d.textContent=text;grid.appendChild(d);state.players.forEach(()=>grid.appendChild(cell("section")))}
function summary(grid,label,type,cls){let d=cell(cls+" sticky-left");d.textContent=label;grid.appendChild(d);state.players.forEach((p,pi)=>{let x=cell(cls);x.style.justifyContent="center";if(type==="upper"){x.dataset.upper=pi;x.textContent=upperTotal(p)}if(type==="bonus"){x.dataset.bonus=pi;let u=upperTotal(p);x.textContent=u>=63?"✓ Bonus erreicht · +35":(63-u)+" bis Bonus";if(u<63)x.classList.add("missing")}if(type==="lower"){x.dataset.lower=pi;x.textContent=lowerTotal(p)}if(type==="total"){x.dataset.total=pi;x.textContent=total(p)}grid.appendChild(x)})}
function header(grid){let c=cell("header-cell sticky-top sticky-left corner");c.textContent="Kategorie";grid.appendChild(c);state.players.forEach((p,pi)=>{let d=cell("header-cell sticky-top"),wrap=document.createElement("div");wrap.className="name-remove";let i=document.createElement("input");i.type="text";i.maxLength=24;i.value=p.name;i.oninput=()=>{state.players[pi].name=i.value;save()};wrap.appendChild(i);if(state.players.length>1){let r=document.createElement("button");r.className="remove-player";r.textContent="×";r.onclick=()=>{if(confirm('"'+p.name+'" wirklich entfernen?')){state.players.splice(pi,1);save();render()}};wrap.appendChild(r)}d.appendChild(wrap);grid.appendChild(d)})}
function update(){state.players.forEach((p,pi)=>{let u=document.querySelector('[data-upper="'+pi+'"]'),b=document.querySelector('[data-bonus="'+pi+'"]'),l=document.querySelector('[data-lower="'+pi+'"]'),t=document.querySelector('[data-total="'+pi+'"]');if(u)u.textContent=upperTotal(p);if(b){let n=upperTotal(p);b.textContent=n>=63?"✓ Bonus erreicht · +35":(63-n)+" bis Bonus";b.classList.toggle("missing",n<63)}if(l)l.textContent=lowerTotal(p);if(t)t.textContent=total(p)});save()}
function render(keep=false){let w=document.getElementById("tableWrapper"),sl=keep?w.scrollLeft:0,st=keep?w.scrollTop:0,g=document.getElementById("playersGrid");g.innerHTML="";g.style.setProperty("--player-count",state.players.length);header(g);section(g,"Oberer Bereich");upper.forEach(c=>{category(g,c);state.players.forEach((p,pi)=>upperInput(g,pi,c))});summary(g,"Oben gesamt","upper","summary");summary(g,"Bis Bonus / Bonus","bonus","bonus");section(g,"Unterer Bereich");lower.forEach(c=>{category(g,c);state.players.forEach((p,pi)=>c.fixed!==undefined?fixed(g,pi,c):numberInput(g,pi,c))});summary(g,"Unten gesamt","lower","summary");summary(g,"GESAMT","total","total");update();if(keep)requestAnimationFrame(()=>{w.scrollLeft=sl;w.scrollTop=st})}
document.getElementById("addPlayerBtn").onclick=()=>{if(state.players.length>=6)return alert("Maximal 6 Spieler sind möglich.");state.players.push(player("Spieler "+(state.players.length+1)));save();render()};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Das komplette Spiel wirklich zurücksetzen?")){state=defaultState();save();render()}};
document.getElementById("landscapeBtn").onclick=async()=>{try{await screen.orientation.lock("landscape")}catch(e){alert("Bitte das Handy manuell ins Querformat drehen.")}};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
render();
</script>
</body>
</html>
